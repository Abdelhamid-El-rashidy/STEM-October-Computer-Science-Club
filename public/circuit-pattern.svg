<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Circuit lines -->
      <path d="M10 50 L40 50 M60 50 L90 50 M50 10 L50 40 M50 60 L50 90" 
            stroke="#18bce9" stroke-width="1" stroke-opacity="0.1"/>
      <path d="M10 10 L40 10 L40 40" 
            stroke="#18bce9" stroke-width="1" stroke-opacity="0.1"/>
      <path d="M90 90 L60 90 L60 60" 
            stroke="#18bce9" stroke-width="1" stroke-opacity="0.1"/>
      <!-- Circuit nodes -->
      <circle cx="50" cy="50" r="3" fill="#18bce9" fill-opacity="0.2"/>
      <circle cx="10" cy="10" r="2" fill="#18bce9" fill-opacity="0.2"/>
      <circle cx="90" cy="90" r="2" fill="#18bce9" fill-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#circuit)"/>
</svg>
